<!--
  Tailwind CDN dev mode (emitted only in production/handoff builds).
  On dev hosts (localhost, 127.0.0.1, *.local, *.test) the Tailwind browser
  build compiles new utility classes on the fly — edit classes in .php/.html
  without rebuilding CSS. On any other host nothing loads.
  Force on/off anywhere: set window.TW_CDN = true/false BEFORE this snippet.
  The style block below carries the @theme tokens from src/styles/tailwind.css.

<style type="text/tailwindcss">
  /* __TW_THEME__ */
</style>
<script>
  (function () {
    var isDevHost =
      /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) || /\.(local|test)$/.test(location.hostname);
    var enabled = typeof window.TW_CDN === 'boolean' ? window.TW_CDN : isDevHost;
    if (!enabled) return;
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js';
    s.integrity = 'sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB';
    s.crossOrigin = 'anonymous';
    document.head.appendChild(s);
  })();
</script>
